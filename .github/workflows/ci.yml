name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oper"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/oper
      DATABASE_POOL_URL: postgres://postgres:postgres@localhost:5432/oper
      BETTER_AUTH_SECRET: ci-only-secret-000000000000000000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_dummy_key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable PostGIS
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d oper -c 'CREATE EXTENSION IF NOT EXISTS postgis;'

      # The early migrations still reference Supabase-owned objects. They are
      # dropped later in the migration chain, so CI only needs harmless stubs.
      - name: Prepare legacy Supabase objects
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d oper <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          SQL

      - name: Migrate
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
